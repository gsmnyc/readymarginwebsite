name: Website builds

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_ENV: preview
      SITE_URL: https://www.readymargin.com
      INDEXNOW_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:forms
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npm run typecheck
      - run: npm run build:sites -- https://ready-margin-website.gsm-consulta-8479.chatgpt.site --preview

