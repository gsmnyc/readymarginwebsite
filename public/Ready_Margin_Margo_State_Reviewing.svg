<svg class="margo animated reviewing reviewing" data-state="reviewing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" role="img" aria-labelledby="title desc">
  <title id="title">Margo reviewing state</title>
  <desc id="desc">Ready Margin mascot state: focus / in progress.</desc>
  
  <style>
    .body { transform-box:fill-box; transform-origin:center; animation:body-breathe 4s ease-in-out infinite; }
    .arm, .report, .state-card, .callout, .spark, .signal { transform-box:fill-box; transform-origin:center; }
    @keyframes body-breathe { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    @keyframes report-review { 0%,100%{transform:rotate(3deg) translate(0,0)} 50%{transform:rotate(-5deg) translate(-7px,5px)} }
    @keyframes arm-point { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-10deg)} }
    @keyframes arm-point-left { 0%,100%{transform:rotate(0)} 50%{transform:rotate(9deg)} }
    @keyframes arm-wave { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-18deg)} 50%{transform:rotate(14deg)} 75%{transform:rotate(-10deg)} }
    @keyframes state-pop { 0%{transform:scale(.9);opacity:.25} 60%{transform:scale(1.04);opacity:1} 100%{transform:scale(1);opacity:1} }
    @keyframes state-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
    @keyframes state-lift { 0%,100%{transform:translateY(0)} 45%{transform:translateY(-10px)} }
    @keyframes state-spark { 0%{opacity:0;transform:scale(.55) rotate(-10deg)} 35%,75%{opacity:1;transform:scale(1) rotate(0)} 100%{opacity:0;transform:scale(.8) rotate(10deg)} }
    @keyframes state-retry { 0%,100%{transform:translateX(0)} 50%{transform:translateX(7px)} }
    .animated.reviewing .report { animation:report-review 1.7s ease-in-out infinite; }
    .animated.reviewing .arm { animation:arm-point 1.7s ease-in-out infinite; }
    .animated.reconciled .signal { animation:state-pop .55s ease-out both; }
    .animated.attention .state-card, .animated.attention .signal { animation:state-pulse 1.1s ease-in-out infinite; }
    .animated.attention .arm { animation:arm-point 1.2s ease-in-out infinite; }
    .animated.explaining .arm { animation:arm-point-left 1.2s ease-in-out infinite; }
    .animated.explaining .callout { animation:state-pop .5s ease-out both; }
    .animated.welcome .arm { animation:arm-wave 1.15s ease-in-out infinite; transform-origin:100% 14%; }
    .animated.welcome .spark, .animated.success .spark { animation:state-spark 1.45s ease-out infinite; }
    .animated.success .body { animation:state-lift 1.2s ease-in-out infinite; }
    .animated.success .signal { animation:state-pop .55s ease-out both; }
    .animated.error .arm { animation:arm-point 1.2s ease-in-out infinite; }
    .animated.error .state-card { animation:state-retry 1.15s ease-in-out infinite; }
    @media (prefers-reduced-motion:reduce) { .animated *, .animated { animation:none!important; } }
  </style>
  <rect width="900" height="860" fill="transparent"/>
  
    <g class="banner">
      <rect x="590" y="100" width="270" height="102" rx="12" fill="#111418"/>
      <rect x="590" y="100" width="8" height="102" rx="4" fill="#7890FF"/>
      <text x="620" y="136" fill="#7890FF" style="font:600 12px Consolas,monospace;letter-spacing:1.5px">MARGO / STATE</text>
      <text x="620" y="169" fill="#F4F6F3" style="font:700 21px Consolas,monospace;letter-spacing:2px">REVIEWING</text>
      <text x="620" y="188" fill="#AAB2BC" style="font:500 10px Consolas,monospace;letter-spacing:1px">FOCUS / IN PROGRESS</text>
    </g>
  
    <g class="body">
      <path fill="#111418" d="M218 132h300l74 74v472l-58 58H218z"/>
      <path fill="#7890FF" d="M518 132v74h74z"/>
      <path fill="#D7FA74" stroke="#111418" stroke-width="16" stroke-linejoin="round" d="M178 112h290l66 66v470l-56 56H178z"/>
      <path fill="#E9FFA8" d="M468 112v66h66z"/>
      <rect x="224" y="194" width="176" height="18" rx="9" fill="#111418"/>
      <rect x="224" y="226" width="106" height="11" rx="6" fill="#111418" opacity=".45"/>
      <rect x="412" y="196" width="44" height="44" rx="5" fill="#7890FF"/>
      <path fill="#F4F6F3" d="M423 209h22v5h-22zm0 10h16v5h-16z"/>
      <rect x="258" y="334" width="42" height="22" rx="7" fill="#111418"/>
      <rect x="400" y="334" width="42" height="22" rx="7" fill="#111418"/>
      <path d="M304 408c40 27 82 27 122 0" fill="none" stroke="#111418" stroke-width="14" stroke-linecap="round"/>
      <g transform="translate(290 458) scale(.48)"><path fill="#111418" d="M28 28h116v40H68v76H28V28Z"/><path fill="#111418" d="M232 232H116v-40h76v-76h40v116Z"/><rect x="111" y="111" width="38" height="38" rx="3" fill="#F4F6F3"/></g>
      <path d="M264 706v70m0 0h-62M424 706v70m0 0h62" fill="none" stroke="#111418" stroke-width="20" stroke-linecap="round"/>
    </g>
  <g class="arm" fill="none" stroke="#111418" stroke-width="18" stroke-linecap="round"><path d="M178 420c-60 10-82 60-103 105"/><circle cx="75" cy="525" r="11" fill="#111418"/><path d="M534 420c40 14 68 39 82 68"/><circle cx="616" cy="488" r="11" fill="#111418"/></g>
  
    <g class="report">
      <rect x="620" y="474" width="176" height="210" rx="12" fill="#F4F6F3" stroke="#111418" stroke-width="12"/>
      <rect x="646" y="508" width="102" height="12" rx="6" fill="#111418"/>
      <text x="646" y="542" fill="#66717B" style="font:600 11px Consolas,monospace;letter-spacing:1px">WEEKLY VIEW</text>
      <rect x="646" y="564" width="120" height="9" rx="4" fill="#AAB2BC"/>
      <rect x="646" y="591" width="92" height="9" rx="4" fill="#AAB2BC"/>
      <rect x="646" y="618" width="128" height="12" rx="6" fill="#7890FF"/>
      <rect x="646" y="647" width="88" height="19" rx="9" fill="#7890FF"/>
      <text x="659" y="660" fill="#111418" style="font:700 9px Consolas,monospace;letter-spacing:1px">IN PROGRESS</text>
    </g><circle cx="758" cy="554" r="25" fill="none" stroke="#7890FF" stroke-width="8"/><path d="m777 573 20 20" stroke="#7890FF" stroke-width="8" stroke-linecap="round"/>
  
</svg>